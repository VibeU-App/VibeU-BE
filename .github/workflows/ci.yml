name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Validate Prisma Schema
        run: pnpm prisma validate

      - name: Build project
        run: pnpm build

      - name: Run tests
        run: pnpm test
        continue-on-error: true # Tests may fail if use-cases are not implemented
