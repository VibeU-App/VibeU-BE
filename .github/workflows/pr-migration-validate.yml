name: Validate Prisma Migration

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'

jobs:
  validate-migration:
    name: Validate Migration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vibeu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Validate Prisma Schema
        run: pnpm prisma validate

      - name: Check for migration drift
        run: |
          # Create a temporary migration to check if schema changes are valid
          pnpm prisma migrate dev --name temp_validation --create-only
          
          # Check if any migration files were created
          if [ -d "prisma/migrations/*temp_validation*" ]; then
            echo "✅ Migration files generated successfully"
            # Remove the temporary migration
            rm -rf prisma/migrations/*temp_validation*
          else
            echo "⚠️ No new migration needed (schema unchanged)"
          fi
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/vibeu"

      - name: Build project
        run: pnpm build
