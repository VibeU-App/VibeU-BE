<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Password Reset Code</title>
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; }

    /* Base */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f5;
      margin: 0;
      padding: 0;
      width: 100%;
    }

    /* Container */
    .email-wrapper {
      padding: 40px 20px;
    }
    .email-container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
    }

    /* Header */
    .email-header {
      background: linear-gradient(135deg, #E11D48 0%, #BE123C 100%);
      padding: 32px 24px;
      text-align: center;
    }
    .email-header h1 {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
    }

    /* Body */
    .email-body {
      padding: 32px 24px;
    }
    .email-body p {
      color: #3f3f46;
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 16px;
    }

    /* Alert Icon */
    .alert-icon {
      text-align: center;
      margin: 0 0 20px;
    }
    .alert-icon span {
      display: inline-block;
      width: 56px;
      height: 56px;
      line-height: 56px;
      background: #FFF1F2;
      border-radius: 50%;
      font-size: 28px;
    }

    /* OTP Box */
    .otp-container {
      text-align: center;
      margin: 28px 0;
    }
    .otp-box {
      display: inline-block;
      background: #FFF1F2;
      border: 2px dashed #E11D48;
      border-radius: 12px;
      padding: 20px 40px;
    }
    .otp-label {
      color: #71717a;
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 8px;
    }
    .otp-code {
      font-size: 40px;
      font-weight: 700;
      color: #E11D48;
      letter-spacing: 12px;
      margin: 0;
      font-family: 'Courier New', monospace;
    }

    /* Info */
    .info-box {
      background: #fafafa;
      border-radius: 8px;
      padding: 16px;
      margin: 24px 0;
    }
    .info-text {
      color: #52525b;
      font-size: 14px;
      text-align: center;
      margin: 0;
    }
    .info-text strong {
      color: #E11D48;
    }

    /* Footer */
    .email-footer {
      padding: 24px;
      border-top: 1px solid #e4e4e7;
    }
    .footer-text {
      color: #a1a1aa;
      font-size: 12px;
      text-align: center;
      margin: 0;
      line-height: 1.5;
    }

    /* Responsive */
    @media only screen and (max-width: 600px) {
      .email-wrapper {
        padding: 20px 12px;
      }
      .email-header {
        padding: 24px 16px;
      }
      .email-header h1 {
        font-size: 20px;
      }
      .email-body {
        padding: 24px 16px;
      }
      .otp-box {
        padding: 16px 24px;
      }
      .otp-code {
        font-size: 32px;
        letter-spacing: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-container">
      <div class="email-header">
        <h1>{{appName}} - Password Reset</h1>
      </div>
      <div class="email-body">
        <div class="alert-icon">
          <span>&#128274;</span>
        </div>
        <p>Hi there,</p>
        <p>You requested a password reset. Your reset code is:</p>
        <div class="otp-container">
          <div class="otp-box">
            <p class="otp-label">Reset Code</p>
            <p class="otp-code">{{otp}}</p>
          </div>
        </div>
        <div class="info-box">
          <p class="info-text">This code will expire in <strong>{{expiryMinutes}} minutes</strong></p>
        </div>
      </div>
      <div class="email-footer">
        <p class="footer-text">If you didn't request a password reset, please ignore this email.<br>Your password will remain unchanged.</p>
      </div>
    </div>
  </div>
</body>
</html>
